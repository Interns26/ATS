version: "3.8"

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: resume-ranker-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
    volumes:
      - minio-data:/data

volumes:
  minio-data: