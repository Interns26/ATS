services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: resume-ranker-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
    volumes:
      - minio-data:/data

  postgres:
    image: postgres:16
    container_name: ats-postgres
    environment:
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats_password
      POSTGRES_DB: ats_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  minio-data:
  postgres-data:
